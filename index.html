<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT_EXTRACTOR // HISTORY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --grid-color: rgba(0, 0, 0, 0.05); }
        body {
            background-color: #f2f2f2; font-family: 'Inter', sans-serif; color: #000; overflow-x: hidden;
            background-image: radial-gradient(circle at center, transparent 0%, #f2f2f2 90%), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 100px 100px, 100px 100px; background-attachment: fixed;
        }
        .dot-font { font-family: 'Silkscreen', cursive; }
        .nothing-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 24px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02); }
        .nothing-input { background: rgba(0, 0, 0, 0.03); border: 1px solid transparent; border-radius: 12px; transition: all 0.2s; }
        .nothing-input:focus { background: #fff; border-color: #000; outline: none; }

        .btn-gray-copy { background-color: #eeeeee; color: #666; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 8px 16px; text-transform: uppercase; transition: all 0.2s; white-space: nowrap; }
        .btn-gray-copy:hover { background-color: #000; color: #fff; }

        .btn-black { background: #000; color: #fff; border-radius: 50px; transition: all 0.2s; }
        .btn-clear { background: #e5e5e5; color: #666; border-radius: 50px; transition: all 0.2s; }
        .tab-active { background: #000 !important; color: #fff !important; }

        .aspect-16-9 { aspect-ratio: 16 / 9; width: 100%; object-fit: cover; border-radius: 18px; }

        /* 履歴カルーセル：2枚+1枚の端が見える設定 */
        .history-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 4px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .history-item {
            min-width: calc(45% - 6px); /* 2枚+αが見えるサイズ */
            scroll-snap-align: start;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .history-item:active { transform: scale(0.95); }
        .history-scroll::-webkit-scrollbar { display: none; }

        .cinema-mode { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 50; background: #000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .cinema-close { position: absolute; top: 20px; right: 20px; color: white; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .slider-container { position: relative; width: 100%; overflow: hidden; border-radius: 18px; background: #000; }
        .slider-track { display: flex; transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1); }
        .slide-item { min-width: 100%; }
        .nav-btn { background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(4px); color: black; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: absolute; top: 50%; transform: translateY(-50%); z-index: 10; cursor: pointer; border: 1px solid rgba(0,0,0,0.05); }
        .slide-dot { width: 5px; height: 5px; border-radius: 50%; background: #ccc; transition: all 0.3s; cursor: pointer; }
        .slide-dot.active { background: #000; width: 20px; border-radius: 10px; }

        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 18px; background: #000; overflow: hidden; }
        #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body class="py-12 px-4 pb-32">

    <div class="max-w-2xl mx-auto">
        <header class="mb-10 pl-2">
            <h1 class="dot-font text-2xl mb-1 tracking-tighter">YT_EXTRACTOR // PROTOCOL</h1>
            <div class="inline-block px-2 py-0.5 border border-black rounded-full">
                <p class="text-[8px] uppercase tracking-[0.2em] font-bold">Version 2.0 // Memory Link</p>
            </div>
        </header>

        <div class="nothing-card p-6 mb-8">
            <div class="flex flex-col gap-4">
                <div class="relative">
                    <input type="text" id="videoUrl" placeholder="INPUT_YOUTUBE_SOURCE" class="nothing-input w-full p-4 pr-24 text-sm font-mono uppercase tracking-tighter">
                    <button onclick="pasteFromClipboard()" class="absolute right-2 top-2 bottom-2 px-4 bg-black text-white rounded-lg text-[9px] font-bold uppercase hover:bg-red-600 transition-colors">Paste</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="processVideo()" class="btn-black flex-grow py-4 font-bold text-xs tracking-[0.1em] uppercase">Start Extraction</button>
                    <button onclick="clearInput()" class="btn-clear px-8 py-4 font-bold text-xs uppercase">Clear</button>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div class="flex gap-2 justify-center">
                <button id="tabThumb" onclick="switchTab('thumb')" class="nothing-card px-8 py-2 text-[10px] font-bold uppercase tab-active transition-all">Assets</button>
                <button id="tabEmbed" onclick="switchTab('embed')" class="nothing-card px-8 py-2 text-[10px] font-bold uppercase text-gray-400 transition-all">Embed</button>
            </div>

            <div id="contentThumb" class="space-y-4">
                <div class="nothing-card p-2 relative">
                    <div class="slider-container aspect-16-9">
                        <div class="nav-btn left-3" onclick="moveSlide(-1)">⟵</div>
                        <div class="nav-btn right-3" onclick="moveSlide(1)">⟶</div>
                        <div class="slider-track" id="sliderTrack"></div>
                    </div>
                    <div class="flex justify-center gap-2 py-3" id="sliderDots"></div>
                </div>

                <div class="grid gap-2">
                    <div class="nothing-card p-4 flex items-center justify-between">
                        <div class="flex-1 mr-4 text-[10px] font-mono"><span class="text-gray-400 block mb-1 uppercase font-bold">Markdown</span><input type="text" id="outMd" readonly class="w-full bg-transparent outline-none"></div>
                        <button onclick="copy('outMd')" class="btn-gray-copy">Copy</button>
                    </div>
                    <div class="nothing-card p-4 flex items-center justify-between">
                        <div class="flex-1 mr-4 text-[10px] font-mono"><span class="text-gray-400 block mb-1 uppercase font-bold">HTML Tag (&lt;img&gt;)</span><input type="text" id="outHtml" readonly class="w-full bg-transparent outline-none"></div>
                        <button onclick="copy('outHtml')" class="btn-gray-copy">Copy</button>
                    </div>
                </div>
            </div>

            <div id="contentEmbed" class="hidden space-y-6">
                <div id="playerContainer" class="nothing-card p-2 relative group">
                    <div class="video-wrapper"><div id="player"></div></div>
                    <button onclick="toggleCinema()" class="absolute bottom-4 right-4 bg-white/80 backdrop-blur px-3 py-1.5 rounded-full text-[9px] font-bold uppercase opacity-0 group-hover:opacity-100 transition-opacity shadow-sm">Cinema Mode</button>
                </div>
                <div class="nothing-card p-6">
                    <div class="grid grid-cols-3 gap-4 mb-4 text-center">
                        <div><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Width</label><input type="number" id="eWidth" value="560" oninput="updateEmbed()" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Height</label><input type="number" id="eHeight" value="315" oninput="updateEmbed()" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div class="relative"><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Start</label><input type="number" id="eStart" value="0" oninput="updateEmbed()" class="nothing-input w-full p-2 text-center text-xs"><button onclick="syncTime()" class="absolute right-1 bottom-1 p-1 bg-black text-white rounded-md text-[8px] uppercase">Sync</button></div>
                    </div>
                    <textarea id="outIframe" readonly rows="2" class="nothing-input w-full p-4 text-[10px] font-mono mb-4 border-dashed border-gray-300"></textarea>
                    <button onclick="copy('outIframe')" class="btn-black w-full py-3 text-xs font-bold uppercase">Copy IFrame</button>
                </div>
            </div>
        </div>

        <div id="historySection" class="mt-12 hidden">
            <h3 class="dot-font text-[10px] uppercase text-gray-400 mb-3 px-2 tracking-widest">Recent Sessions</h3>
            <div class="history-scroll" id="historyList">
                </div>
        </div>
    </div>

    <div id="cinemaOverlay" class="hidden cinema-mode" onclick="toggleCinema()">
        <div class="cinema-close">✕</div>
        <div id="cinemaContent" class="w-full max-w-4xl aspect-video bg-black rounded-lg overflow-hidden shadow-2xl" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        let player, currentVideoId = "";
        let currentSlide = 0, thumbSources = [], isCinema = false;

        // 初期化時に履歴を読み込む
        window.onload = loadHistory;

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                if (text) { document.getElementById('videoUrl').value = text; processVideo(); }
            } catch (err) {}
        }

        function clearInput() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('resultArea').classList.add('hidden');
            if(player) player.stopVideo();
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function processVideo(vid = null) {
            const urlInput = document.getElementById('videoUrl');
            currentVideoId = vid || extractVideoId(urlInput.value);
            if (!currentVideoId) return;

            // 履歴に保存
            saveHistory(currentVideoId);

            document.getElementById('resultArea').classList.remove('hidden');
            thumbSources = [
                { type: 'Main', url: `https://img.youtube.com/vi/${currentVideoId}/maxresdefault.jpg`, fallback: `https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg` },
                { type: 'Scene 1', url: `https://img.youtube.com/vi/${currentVideoId}/1.jpg` },
                { type: 'Scene 2', url: `https://img.youtube.com/vi/${currentVideoId}/2.jpg` },
                { type: 'Scene 3', url: `https://img.youtube.com/vi/${currentVideoId}/3.jpg` }
            ];

            setupSlider();
            currentSlide = 0;
            updateSlideView();

            if (player && player.loadVideoById) { player.loadVideoById(currentVideoId); }
            else { player = new YT.Player('player', { videoId: currentVideoId, playerVars: { 'rel': 0 }, events: { 'onReady': updateEmbed } }); }
            updateEmbed();
        }

        // --- 履歴機能ロジック ---
        function saveHistory(id) {
            let history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            history = history.filter(item => item !== id); // 重複削除
            history.unshift(id); // 先頭に追加
            history = history.slice(0, 10); // 最大10件
            localStorage.setItem('yt_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            const list = document.getElementById('historyList');
            const section = document.getElementById('historySection');

            if (history.length === 0) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden');
            list.innerHTML = '';

            history.forEach(id => {
                const item = document.createElement('div');
                item.className = 'history-item nothing-card p-1.5 overflow-hidden';
                item.innerHTML = `<img src="https://img.youtube.com/vi/${id}/mqdefault.jpg" class="aspect-16-9 object-cover rounded-[14px]">`;
                item.onclick = () => {
                    document.getElementById('videoUrl').value = `https://www.youtube.com/watch?v=${id}`;
                    processVideo(id);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                list.appendChild(item);
            });
        }

        function toggleCinema() {
            const overlay = document.getElementById('cinemaOverlay');
            isCinema = !isCinema;
            if (isCinema) {
                overlay.classList.remove('hidden');
                document.getElementById('cinemaContent').appendChild(document.getElementById('player'));
            } else {
                overlay.classList.add('hidden');
                document.querySelector('.video-wrapper').appendChild(document.getElementById('player'));
            }
        }

        function setupSlider() {
            const track = document.getElementById('sliderTrack'), dots = document.getElementById('sliderDots');
            track.innerHTML = ''; dots.innerHTML = '';
            thumbSources.forEach((src, idx) => {
                const img = document.createElement('img');
                img.src = src.url; img.className = 'slide-item aspect-16-9';
                if(src.fallback) img.onerror = () => { img.src = src.fallback; thumbSources[idx].url = src.fallback; updateOutputLinks(); };
                track.appendChild(img);
                const dot = document.createElement('div');
                dot.className = 'slide-dot' + (idx === 0 ? ' active' : '');
                dot.onclick = () => { currentSlide = idx; updateSlideView(); };
                dots.appendChild(dot);
            });
        }

        function moveSlide(step) { currentSlide = (currentSlide + step + thumbSources.length) % thumbSources.length; updateSlideView(); }

        function updateSlideView() {
            const track = document.getElementById('sliderTrack'), dots = document.querySelectorAll('.slide-dot');
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot, i) => dot.classList.toggle('active', i === currentSlide));
            updateOutputLinks();
        }

        function updateOutputLinks() {
            const currentUrl = thumbSources[currentSlide].url;
            document.getElementById('outMd').value = `[![](${currentUrl})](https://www.youtube.com/watch?v=${currentVideoId})`;
            document.getElementById('outHtml').value = `<a href="https://www.youtube.com/watch?v=${currentVideoId}"><img src="${currentUrl}" alt="Thumbnail"></a>`;
        }

        function syncTime() {
            if (player && player.getCurrentTime) { document.getElementById('eStart').value = Math.floor(player.getCurrentTime()); updateEmbed(); }
        }

        function updateEmbed() {
            if (!currentVideoId) return;
            const w = document.getElementById('eWidth').value, h = document.getElementById('eHeight').value, s = document.getElementById('eStart').value;
            let embedUrl = `https://www.youtube.com/embed/${currentVideoId}?rel=0${s > 0 ? '&start='+s : ''}`;
            document.getElementById('outIframe').value = `<iframe width="${w}" height="${h}" src="${embedUrl}" frameborder="0" allowfullscreen></iframe>`;
        }

        function switchTab(type) {
            const isThumb = type === 'thumb';
            document.getElementById('tabThumb').classList.toggle('tab-active', isThumb);
            document.getElementById('tabEmbed').classList.toggle('tab-active', !isThumb);
            document.getElementById('contentThumb').classList.toggle('hidden', !isThumb);
            document.getElementById('contentEmbed').classList.toggle('hidden', isThumb);
        }

        async function copy(id) {
            const el = document.getElementById(id);
            await navigator.clipboard.writeText(el.value);
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            btn.innerText = "DONE";
            setTimeout(() => { btn.innerText = originalText; }, 800);
        }
    </script>
</body>
</html>
