<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>YT_EXTRACTOR // PROTOCOL v6.9.0</title>

	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://www.youtube.com/iframe_api"></script>

	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&family=Silkscreen&display=swap" rel="stylesheet">

	<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

	<script src="https://unpkg.com/@phosphor-icons/web"></script>
	<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

	<link rel="stylesheet" href="style.css">
</head>

<body class="py-12 px-4">

<div id="appContainer" class="max-w-2xl mx-auto">

	<!-- Header -->
	<header class="relative mb-10 mx-2 pl-2 p-2">
		<span class="absolute -top-2 -left-2 text-[10px] text-black/20">+</span>
		<span class="absolute -top-2 -right-2 text-[10px] text-black/20">+</span>
		<span class="absolute -bottom-4 -left-2 text-[10px] text-black/20">+</span>
		<span class="absolute -bottom-4 -right-2 text-[10px] text-black/20">+</span>

		<h1 onclick="location.reload()" class="dot-font text-2xl leading-none tracking-tighter cursor-pointer active:opacity-50 transition-opacity">YT_EXTRACTOR</h1>

		<div class="inline-block px-2 py-1 ring-1 ring-black/20 rounded-md">
			<p class="text-[7px] text-black/60 uppercase tracking-[0.25em] font-bold leading-none">
				Version 6.9.0 <span class="mx-1 text-black/20">//</span> MODULE_DIVIDED_ACTIVE
			</p>
		</div>
	</header>
	<!-- //Header -->



	<!-- Main Input Area -->
	<div class="nothing-card p-6 mb-8">

		<div class="flex flex-col gap-4">

			<!-- Input Box and Paste Button -->
			<div class="relative w-full" onmouseenter="showTooltip('input-tip')">

				<div id="input-tip" class="absolute bottom-[110%] left-0 opacity-0 translate-y-[2px] transition-all duration-1000 ease-out z-[9999] pointer-events-none">
					<div class="pb-3">
						<div class="relative bg-[#333333]/90 text-white text-[11px] px-3 py-1.5 rounded-xl shadow-xl whitespace-nowrap flex items-center gap-2 border border-white/10" style="font-family: 'DotGothic16', sans-serif;">
							<span class="w-1.5 h-1.5 bg-red-500 rounded-full shadow-[0_0_5px_rgba(239,68,68,0.8)]"></span>
							<span class="tracking-widest font-medium">入力：動画のURL、またはプレイリストのリンクをペーストしてください</span>
							<div class="absolute -bottom-1 left-5 w-2 h-2 bg-[#333333] rotate-45 border-r border-b border-white/10"></div>
						</div>
					</div>
				</div>

				<input type="text" id="videoUrl" placeholder="PASTE YOUTUBE URL OR PLAYLIST..." class="nothing-input w-full p-4 pr-24 text-sm font-mono uppercase focus:outline-none">
				<!-- // Input Box -->

				<!-- Paste Button -->
				<div class="absolute right-2 top-2 bottom-2 flex items-center">

					<div class="relative group h-full" onmouseenter="showTooltip('paste-tip')">

					<div id="paste-tip" class="absolute bottom-[110%] right-0 opacity-0 translate-y-[2px] transition-[opacity,transform] duration-1000 ease-out z-[9999] pointer-events-none">

						<div class="pb-3">
							<div class="relative bg-[#333333]/90 text-white text-[11px] px-3 py-1.5 rounded-xl shadow-xl whitespace-nowrap flex items-center gap-2 border border-white/10" style="font-family: 'DotGothic16', sans-serif;">
								<span class="w-1.5 h-1.5 bg-blue-400 rounded-full shadow-[0_0_5px_rgba(96,165,250,0.8)]"></span>
								<span class="tracking-widest font-medium">貼付：クリップボードの内容を入力欄に展開します</span>
								<div class="absolute -bottom-1 right-4 w-2 h-2 bg-[#333333] rotate-45 border-r border-b border-white/10"></div>
							</div>
						</div>
					</div>

					<button id="pasteBtn" class="h-full px-4 bg-black text-white rounded-full text-[9px] font-bold uppercase tracking-[0.15em] active:scale-95 transition-transform">
						Paste
					</button>
				</div>
				<!-- // Paste Button -->

				</div>
			</div>
			<!-- // Input Box and Paste Button -->


			<!-- Action Buttons -->
			<div class="flex items-center gap-4 mt-0 w-full">

				<!-- Extraction Button -->
				<div class="relative group flex-grow" onmouseenter="showTooltip('start-tip')">

					<div id="start-tip" class="absolute top-[50px] left-0 opacity-0 translate-y-[-2px] transition-all duration-1000 ease-out z-[9999] pointer-events-none">
						<div class="pt-3">
							<div class="relative bg-[#333333]/90 text-white text-[11px] px-3 py-1.5 rounded-xl shadow-xl whitespace-nowrap flex items-center gap-2 border border-white/10" style="font-family: 'DotGothic16', sans-serif;">
								<span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse shadow-[0_0_8px_rgba(255,255,255,1)]"></span>
								<span class="tracking-widest font-medium">実行：対象のURLを解析し、データの抽出プロセスを開始します</span>
								<div class="absolute -top-1 left-5 w-2 h-2 bg-[#333333] rotate-45 border-l border-t border-white/10"></div>
							</div>
						</div>
					</div>

					<button onclick="processInput()" class="btn-black-rect w-full !rounded-[50px] py-4 font-bold text-xs uppercase transition-all">
						Start Extraction
					</button>
				</div>
				<!-- // Extraction Button -->



				<!-- Clear  Button -->
				<div class="relative group w-fit" onmouseenter="showTooltip('clear-tip')">

					<div id="clear-tip" class="absolute top-[50px] right-0 opacity-0 translate-y-[-2px] transition-all duration-1000 ease-out z-[9999] pointer-events-none">

						<div class="pt-3">
							<div class="relative bg-[#333333]/90 text-white text-[11px] px-3 py-1.5 rounded-xl shadow-xl whitespace-nowrap flex items-center gap-2 border border-white/10" style="font-family: 'DotGothic16', sans-serif;">
								<span class="w-1.5 h-1.5 bg-amber-500 rounded-full shadow-[0_0_5px_rgba(245,158,11,0.8)]"></span>
								<span class="tracking-widest font-medium ">消去：入力内容をすべて破棄し、初期状態に復します</span>
								<div class="absolute -top-1 right-5 w-2 h-2 bg-[#333333] rotate-45 border-l border-t border-white/10"></div>
							</div>
						</div>
					</div>

					<button onclick="clearInput()" class="bg-gray-200 text-gray-600 px-8 py-4 rounded-[50px] font-bold text-xs uppercase hover:bg-black/5 transition-colors whitespace-nowrap">
						Clear
					</button>
				</div>
				<!-- // Clear Button -->

			</div>
			<!-- // Action Buttons -->

		</div>
	</div>
	<!-- //Main Input Area -->





	<!-- Result Display Area -->
	<div id="resultArea" class="hidden space-y-6">

		<!-- Tab Buttons -->
		<div class="tab-container flex gap-1 mb-8 bg-gray-100/50 p-1 rounded-[24px] backdrop-blur-sm border border-black/5">

			<button id="tabThumb" onclick="switchTab('thumb')"
				class="flex-grow h-[40px] rounded-[20px] text-[10px] font-bold tracking-[0.1em] transition-all flex items-center justify-center gap-2 uppercase leading-none">
				<i class="ph-thin ph-images text-[16px] translate-y-[0.5px]"></i>
				<span>Assets</span>
			</button>

			<button id="tabEmbed" onclick="switchTab('embed')"
				class="flex-grow h-[40px] rounded-[20px] text-[10px] font-bold tracking-[0.1em] transition-all flex items-center justify-center gap-2 uppercase leading-none">
				<i class="ph-thin ph-youtube-logo text-[16px] translate-y-[0.5px]"></i>
				<span>Embed</span>
			</button>
		</div>
		<!-- // Tab Buttons -->

<div class="result-header ">
    <h3 id="vTitle"></h3>
</div>



		<!-- Main Assets content -->
		<div id="contentThumb" class="space-y-4">

			<div class="nothing-card p-2 relative">
				<div class="fixed-aspect">
					<div class="nav-btn" style="left:10px;" onclick="moveSlide('mainSlider', -1)"><div class="arrow" style="transform:rotate(-135deg);"></div></div>
					<div class="nav-btn" style="right:10px;" onclick="moveSlide('mainSlider', 1)"><div class="arrow" style="transform:rotate(45deg);"></div></div>
					<div class="slider-viewport" id="mainSlider"></div>
				</div>
				<div id="mainIndicator" class="indicator-container"></div>
				<div id="assetMeta" class="text-center text-[9px] font-bold text-gray-400 uppercase mt-1"></div>
			</div>

			<div id="thumbOutputs" class="space-y-4"></div>

		</div>
		<!-- // Main Assets content -->



		<!-- Main Embed content -->
			<div id="contentEmbed" class="hidden space-y-4">

				<!-- Player -->
<div id="main-card-wrapper" class="nothing-card video-preview-area p-2 relative">
    <div id="video-container" class="fixed-aspect">
		<div id="player-placeholder" class="absolute inset-0 z-10 transition-opacity duration-500">
			<img id="placeholder-img" src="" class="w-full h-full object-cover blur-sm opacity-50">
			<div class="absolute inset-0 flex items-center justify-center">
				<p class="text-[10px] font-bold tracking-[0.3em] animate-pulse">LOADING...</p>
				</div>
			</div>


        <div id="player-wrapper" class="w-full h-full">
            <div id="player"></div>
        </div>
    </div>
</div>
				<!-- // Player -->




				<!-- Embed Code Panel -->
				<div class="nothing-card p-6">


					<div class="flex items-center gap-2 mb-4">
						<input type="checkbox" id="keepAspect" checked class="w-4 h-4 accent-black">
						<label for="keepAspect" class="text-[10px] font-bold uppercase mr-4 md:mr-4">Keep 16:9 Aspect Ratio</label>

						<input type="checkbox" id="checkLoop" class="w-4 h-4 accent-black" onchange="saveLoopSetting(); updateEmbedOutputs()" >
						<label for="checkLoop" class="text-[10px] font-bold uppercase mr-4 md:mr-4">Loop</label>
					</div>



<div class="grid grid-cols-3 gap-3 mb-1">
    <div>
        <label class="text-[9px] text-gray-400 block mb-1 text-center uppercase">Width</label>
        <input type="number" id="eWidth" value="560"
               oninput="resizeEmbed('w')"
               onwheel="handleWheel(event, 'w')"
               onclick="this.select()"
               class="nothing-input w-full p-2 text-center text-xs">
</div>

    <div>
        <label class="text-[9px] text-gray-400 block mb-1 text-center uppercase">Height</label>
        <input type="number" id="eHeight" value="315"
               oninput="resizeEmbed('h')"
               onwheel="handleWheel(event, 'h')"
               onclick="this.select()"
               class="nothing-input w-full p-2 text-center text-xs">
    </div>

	<div class="relative">
		<div class="flex justify-between items-center mb-1 px-1">
			<label class="text-[9px] text-gray-400 uppercase">Start (s)</label>
			<span id="timeFormat" class="text-[9px] text-black/40 font-mono tracking-tighter">0:00</span>
		</div>
		<input type="number" id="eStart" value="0"
			oninput="handleStartSecondsChange(); updateSizeButtonStyles();"
			onwheel="handleWheel(event, 's')"
			onclick="this.select()"
			class="nothing-input w-full p-2 text-center text-xs">
		<button onclick="syncTime()" class="absolute right-1 bottom-1 p-1 bg-black text-white rounded text-[7px]">SYNC</button>
	</div>
</div>


<div class="mt-4 mb-4">
    <div id="normalControls" class="flex flex-wrap gap-2">
        <button onclick="setEmbedSize(480, 270)" class="btn-gray-copy tracking-widest transition-all">480x270</button>
        <button onclick="setEmbedSize(560, 315)" class="btn-gray-copy tracking-widest transition-all">560x315</button>
        <button onclick="setEmbedSize(853, 480)" class="btn-gray-copy tracking-widest transition-all">853x480</button>
        <button onclick="setEmbedSize(1280, 720)" class="btn-gray-copy tracking-widest transition-all">1280x720</button>
        <button onclick="setEmbedSize(1920, 1080)" class="btn-gray-copy tracking-widest transition-all">1920x1080</button>
    </div>

    <div id="shortsControls" class="flex flex-wrap gap-2 hidden">
        <button onclick="setEmbedSize(315, 560)" class="btn-gray-copy tracking-widest transition-all">315x560 (Small)</button>
        <button onclick="setEmbedSize(405, 720)" class="btn-gray-copy tracking-widest transition-all">405x720 (Standard)</button>
        <button onclick="setEmbedSize(540, 960)" class="btn-gray-copy tracking-widest transition-all">540x960 (HD)</button>
    </div>
</div>




					<div class="mt-8 mb-8">
						<button onclick="openEmbedPreview()"
								class="w-full py-4 bg-black text-white text-[11px] font-bold uppercase tracking-widest hover:bg-black/80 transition-all rounded-xl shadow-lg active:scale-[0.98]">
							Preview Actual Size
						</button>
					</div>



					<!-- Embed tags area -->
					<div id="embedOutputAreas" class="space-y-4"></div>
					<!-- // Embed tags area -->




					<!-- SNS Share Buttons -->
					<div class="space-y-4 mt-10 border-t border-black/[0.05] pt-8">
						<label class="pl-[12px] text-[9px] text-black/30 block uppercase font-bold tracking-[0.2em]">
							Signal Distribution
						</label>

						<div class="flex flex-wrap items-center gap-3 sm:gap-0 pl-[16px]">

							<button onclick="share('x')" class="group flex items-center justify-center sm:justify-start gap-2 text-black/40 hover:text-black transition-all sm:w-[80px]">
								<iconify-icon icon="simple-icons:x" width="14" class="flex-shrink-0"></iconify-icon>
								<span class="text-[8px] font-bold uppercase tracking-widest hidden sm:block opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">X-APP</span>
							</button>

							<button onclick="share('threads')" class="group flex items-center justify-center sm:justify-start gap-2 text-black/40 hover:text-black transition-all sm:w-[90px]">
								<iconify-icon icon="simple-icons:threads" width="14" class="flex-shrink-0"></iconify-icon>
								<span class="text-[8px] font-bold uppercase tracking-widest hidden sm:block opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Threads</span>
							</button>

							<button onclick="share('line')" class="group flex items-center justify-center sm:justify-start gap-2 text-black/40 hover:text-black transition-all sm:w-[80px]">
								<iconify-icon icon="simple-icons:line" width="14" class="flex-shrink-0"></iconify-icon>
								<span class="text-[8px] font-bold uppercase tracking-widest hidden sm:block opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Line</span>
							</button>

							<button onclick="share('facebook')" class="group flex items-center justify-center sm:justify-start gap-2 text-black/40 hover:text-black transition-all sm:w-[100px]">
								<iconify-icon icon="simple-icons:facebook" width="14" class="flex-shrink-0"></iconify-icon>
								<span class="text-[8px] font-bold uppercase tracking-widest hidden sm:block opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Facebook</span>
							</button>

							<button onclick="copyCurrentUrl(this)" class="group flex items-center justify-center sm:justify-start gap-2 text-black/40 hover:text-black transition-all sm:w-[110px]">
								<iconify-icon icon="simple-icons:linktree" width="14" style="transform: rotate(90deg);" class="flex-shrink-0"></iconify-icon>
								<span class="text-[8px] font-bold uppercase tracking-widest hidden sm:block opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Copy Link</span>
							</button>

						</div>
					</div>
					<!-- // SNS Share Buttons -->


				</div>
				<!-- // Embed Code Panel -->

			</div>
			<!-- // Main Embed content -->


		</div>
		<!-- // Result Display Area -->






		<div id="playlistSection" class="mt-12 hidden border-t border-black/10 pt-8">
			<h3 class="dot-font text-[10px] uppercase mb-3 px-2 font-bold">Playlist Contents</h3>
			<div class="relative">
				<div class="nav-btn !w-8 !h-8" style="left:-10px;" onclick="moveSlide('playlistList', -1)"><div class="arrow !w-1.5 !h-1.5" style="transform:rotate(-135deg);"></div></div>
				<div class="nav-btn !w-8 !h-8" style="right:-10px;" onclick="moveSlide('playlistList', 1)"><div class="arrow !w-1.5 !h-1.5" style="transform:rotate(45deg);"></div></div>


				<div id="playlistList" class="horizontal-scroll gap-x-[8px] md:gap-x-[16px]"></div>
			</div>
			<div id="playlistIndicator" class="indicator-container"></div>
		</div>



		<div id="historySection" class="mt-12 hidden border-t border-black/10 pt-8">
			<h3 class="dot-font text-[10px] uppercase mb-3 px-2 font-bold">History</h3>
			<div class="relative">
				<div class="nav-btn !w-8 !h-8" style="left:-10px;" onclick="moveSlide('historyList', -1)"><div class="arrow !w-1.5 !h-1.5" style="transform:rotate(-135deg);"></div></div>
				<div class="nav-btn !w-8 !h-8" style="right:-10px;" onclick="moveSlide('historyList', 1)"><div class="arrow !w-1.5 !h-1.5" style="transform:rotate(45deg);"></div></div>

				<div id="historyList" class="horizontal-scroll gap-x-[8px] md:gap-x-[16px]"></div>
			</div>
			<div id="historyIndicator" class="indicator-container"></div>
			<div class="flex justify-end mt-4 px-2">
				<button onclick="copyAllHistory()" class="text-[9px] font-bold text-gray-400 border border-gray-300 rounded-full px-4 py-1 uppercase hover:bg-black hover:text-white transition-all">Copy All History URLs</button>
			</div>
		</div>

		<footer class="mt-20 text-center pb-10">
			<a href="https://www.amazon.jp/hz/wishlist/ls/zeitgeist-22" target="_blank" class="amazon-btn mb-8">Support Project</a>
			<p class="copyright">YT_EXTRACTOR v6.9.0 // FAREASTNOISE</p>
		</footer>
	</div>



	<script src="script.js"></script>
</body>
</html>
