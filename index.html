<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT_EXTRACTOR // PROTOCOL v2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --grid-color: rgba(0, 0, 0, 0.05); }
        body {
            background-color: #f2f2f2; font-family: 'Inter', sans-serif; color: #000; overflow-x: hidden;
            background-image: radial-gradient(circle at center, transparent 0%, #f2f2f2 90%), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 100px 100px, 100px 100px; background-attachment: fixed;
            scroll-behavior: smooth;
        }
        .dot-font { font-family: 'Silkscreen', cursive; }
        .nothing-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 24px; }
        .nothing-input { background: rgba(0, 0, 0, 0.03); border: 1px solid transparent; border-radius: 12px; transition: all 0.2s; -webkit-appearance: none; }

        .btn-black { background: #000; color: #fff; border-radius: 50px; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn-black:active { transform: scale(0.98); background: #333; }

        .btn-gray-copy { background-color: #eeeeee; color: #666; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 8px 16px; text-transform: uppercase; }

        /* 履歴：2.5個表示設定 */
        .history-container { position: relative; width: 100%; }
        .history-scroll {
            display: flex; overflow-x: auto; gap: 12px; padding: 10px 0;
            scroll-behavior: smooth; scroll-snap-type: x mandatory;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .history-scroll::-webkit-scrollbar { display: none; }
        .history-item { min-width: 40%; scroll-snap-align: start; cursor: pointer; }

        /* 線の矢印ボタン */
        .hist-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; background: rgba(255,255,255,0.7);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 30; cursor: pointer; opacity: 0; pointer-events: none;
        }
        @media (hover: hover) {
            .history-container:hover .hist-nav { opacity: 1; pointer-events: auto; }
        }
        .arrow { width: 10px; height: 10px; border-top: 2px solid #000; border-right: 2px solid #000; }
        .arrow-left { transform: rotate(-135deg); margin-left: 4px; }
        .arrow-right { transform: rotate(45deg); margin-right: 4px; }

        .hist-nav.prev { left: -20px; }
        .hist-nav.next { right: -20px; }

        .slider-container { position: relative; width: 100%; overflow: hidden; border-radius: 18px; background: #000; }
        .slider-track { display: flex; transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1); }
        .slide-item { min-width: 100%; }
    </style>
</head>
<body class="py-12 px-4 pb-48">

    <div class="max-w-2xl mx-auto">
        <header id="top" class="mb-10 pl-2">
            <h1 class="dot-font text-2xl mb-1 tracking-tighter">YT_EXTRACTOR</h1>
            <div class="inline-block px-2 py-0.5 border border-black rounded-full">
                <p class="text-[8px] uppercase tracking-[0.2em] font-bold">Version 2.5 // iOS Optimized</p>
            </div>
        </header>

        <div class="nothing-card p-6 mb-8">
            <div class="flex flex-col gap-4">
                <div class="relative">
                    <input type="text" id="videoUrl" placeholder="PASTE YOUTUBE URL" class="nothing-input w-full p-4 pr-24 text-sm font-mono uppercase">
                    <button id="pasteBtn" class="absolute right-2 top-2 bottom-2 px-4 bg-black text-white rounded-lg text-[9px] font-bold uppercase active:bg-red-600 transition-colors">Paste</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="processVideo()" class="btn-black flex-grow py-4 font-bold text-xs uppercase">Start Extraction</button>
                    <button onclick="clearInput()" class="bg-gray-200 text-gray-600 px-8 py-4 rounded-[50px] font-bold text-xs uppercase">Clear</button>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div class="nothing-card p-2 relative">
                <div class="slider-container aspect-16-9">
                    <div class="slider-track" id="sliderTrack"></div>
                </div>
                <div class="flex justify-center gap-2 py-3" id="sliderDots"></div>
            </div>

            <div class="grid gap-2" id="outputs">
                </div>
        </div>

        <div id="historySection" class="mt-12 hidden border-t border-black/5 pt-8">
            <h3 class="dot-font text-[10px] uppercase text-gray-400 mb-2 px-2 tracking-widest">Recent Sessions</h3>
            <div class="history-container">
                <div class="hist-nav prev" onclick="scrollHist(-1)"><div class="arrow arrow-left"></div></div>
                <div class="hist-nav next" onclick="scrollHist(1)"><div class="arrow arrow-right"></div></div>
                <div class="history-scroll" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        let currentVideoId = "";
        let thumbSources = [];

        window.onload = () => {
            loadHistory();
            setupWheelScroll();

            // iPhone用の貼り付けイベントリスナー
            document.getElementById('pasteBtn').addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        document.getElementById('videoUrl').value = text;
                        processVideo();
                    }
                } catch (err) {
                    alert("ブラウザの「貼り付け」許可が必要です。または入力欄を長押ししてペーストしてください。");
                }
            });
        };

        function setupWheelScroll() {
            const list = document.getElementById('historyList');
            list.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) { e.preventDefault(); list.scrollLeft += e.deltaY; }
            }, { passive: false });
        }

        function scrollHist(dir) {
            const list = document.getElementById('historyList');
            list.scrollBy({ left: dir * (list.clientWidth * 0.8), behavior: 'smooth' });
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            const list = document.getElementById('historyList');
            const section = document.getElementById('historySection');
            if (history.length === 0) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden');
            list.innerHTML = '';
            history.forEach(id => {
                const item = document.createElement('div');
                item.className = 'history-item nothing-card p-1.5';
                item.innerHTML = `<img src="https://img.youtube.com/vi/${id}/mqdefault.jpg" class="aspect-16-9 object-cover rounded-[14px] pointer-events-none">`;
                item.onclick = () => {
                    document.getElementById('videoUrl').value = `https://www.youtube.com/watch?v=${id}`;
                    processVideo(id);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                list.appendChild(item);
            });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function processVideo(vid = null) {
            currentVideoId = vid || extractVideoId(document.getElementById('videoUrl').value);
            if (!currentVideoId) return;

            saveHistory(currentVideoId);
            document.getElementById('resultArea').classList.remove('hidden');

            thumbSources = [
                { type: 'Main', url: `https://img.youtube.com/vi/${currentVideoId}/maxresdefault.jpg`, fallback: `https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg` },
                { type: 'Scene 1', url: `https://img.youtube.com/vi/${currentVideoId}/1.jpg` },
                { type: 'Scene 2', url: `https://img.youtube.com/vi/${currentVideoId}/2.jpg` },
                { type: 'Scene 3', url: `https://img.youtube.com/vi/${currentVideoId}/3.jpg` }
            ];

            const track = document.getElementById('sliderTrack');
            track.innerHTML = thumbSources.map(s => `<img src="${s.url}" class="slide-item aspect-16-9" onerror="this.src='https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg'">`).join('');

            updateOutputs();
        }

        function updateOutputs() {
            const url = thumbSources[0].url;
            const html = `
                ${createCopyRow('Markdown', `[![](${url})](https://www.youtube.com/watch?v=${currentVideoId})`, 'outMd')}
                ${createCopyRow('HTML Tag', `<a href="https://www.youtube.com/watch?v=${currentVideoId}"><img src="${url}"></a>`, 'outHtml')}
                ${createCopyRow('Image URL', url, 'outUrl')}
            `;
            document.getElementById('outputs').innerHTML = html;
        }

        function createCopyRow(label, value, id) {
            return `
                <div class="nothing-card p-4 flex items-center justify-between">
                    <div class="flex-1 mr-4 text-[10px] font-mono"><span class="text-gray-400 block mb-1 uppercase font-bold">${label}</span><input type="text" id="${id}" value='${value}' readonly class="w-full bg-transparent outline-none"></div>
                    <button onclick="copy('${id}')" class="btn-gray-copy">Copy</button>
                </div>`;
        }

        function saveHistory(id) {
            let history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            history = [id, ...history.filter(x => x !== id)].slice(0, 10);
            localStorage.setItem('yt_history', JSON.stringify(history));
            loadHistory();
        }

        async function copy(id) {
            const el = document.getElementById(id);
            await navigator.clipboard.writeText(el.value);
            const btn = event.currentTarget;
            btn.innerText = "DONE";
            setTimeout(() => btn.innerText = "COPY", 800);
        }

        function clearInput() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('resultArea').classList.add('hidden');
        }
    </script>
</body>
</html>
