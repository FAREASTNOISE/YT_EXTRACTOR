<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT_EXTRACTOR // PROTOCOL v6.9.0</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="py-12 px-4">

    <div class="max-w-2xl mx-auto">
        <header class="mb-10 pl-2">
            <h1 onclick="location.reload()" class="dot-font text-2xl mb-1 tracking-tighter cursor-pointer">YT_EXTRACTOR</h1>
            <div class="inline-block px-2 py-0.5 border border-black rounded-full">
                <p class="text-[8px] uppercase tracking-[0.2em] font-bold">Version 6.9.0 // MODULE_DIVIDED_ACTIVE</p>
            </div>
        </header>

        <div class="nothing-card p-6 mb-8">
            <div class="flex flex-col gap-4">
                <div class="relative">
                    <input type="text" id="videoUrl" placeholder="PASTE YOUTUBE URL OR PLAYLIST..." class="nothing-input w-full p-4 pr-24 text-sm font-mono uppercase focus:outline-none">
                    <button id="pasteBtn" class="absolute right-2 top-2 bottom-2 px-4 bg-black text-white rounded-lg text-[9px] font-bold uppercase">Paste</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="processInput()" class="btn-black-rect flex-grow !rounded-[50px]">Start Extraction</button>
                    <button onclick="clearInput()" class="bg-gray-200 text-gray-600 px-8 py-4 rounded-[50px] font-bold text-xs uppercase">Clear</button>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div class="flex gap-2 justify-center">
                <button id="tabThumb" onclick="switchTab('thumb')" class="nothing-card px-6 py-2 text-[10px] font-bold uppercase">Assets</button>
                <button id="tabEmbed" onclick="switchTab('embed')" class="nothing-card px-6 py-2 text-[10px] font-bold uppercase">Embed</button>
            </div>

            <div id="contentThumb" class="space-y-4">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect">
                        <div class="nav-btn" style="left:10px;" onclick="moveSlide('mainSlider', -1)"><div class="arrow" style="transform:rotate(-135deg);"></div></div>
                        <div class="nav-btn" style="right:10px;" onclick="moveSlide('mainSlider', 1)"><div class="arrow" style="transform:rotate(45deg);"></div></div>
                        <div class="slider-viewport" id="mainSlider"></div>
                    </div>
                    <div id="mainIndicator" class="indicator-container"></div>
                    <div id="assetMeta" class="text-center text-[9px] font-bold text-gray-400 uppercase mt-1"></div>
                </div>
                <div id="thumbOutputs" class="space-y-4"></div>
            </div>

            <div id="contentEmbed" class="hidden space-y-6">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect">
                        <div id="player-wrapper" class="w-full h-full"><div id="player"></div></div>
                    </div>
                </div>
                <div class="nothing-card p-6">
                    <div class="flex items-center gap-2 mb-4">
                        <input type="checkbox" id="keepAspect" checked class="w-4 h-4 accent-black">
                        <label for="keepAspect" class="text-[10px] font-bold uppercase">Keep 16:9 Aspect Ratio</label>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <div><label class="text-[9px] text-gray-400 block mb-1 text-center uppercase">Width</label><input type="number" id="eWidth" value="560" oninput="resizeEmbed('w')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div><label class="text-[9px] text-gray-400 block mb-1 text-center uppercase">Height</label><input type="number" id="eHeight" value="315" oninput="resizeEmbed('h')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div class="relative"><label class="text-[9px] text-gray-400 block mb-1 text-center uppercase">Start (s)</label><input type="number" id="eStart" value="0" oninput="updateEmbedOutputs()" class="nothing-input w-full p-2 text-center text-xs"><button onclick="syncTime()" class="absolute right-1 bottom-1 p-1 bg-black text-white rounded text-[7px]">SYNC</button></div>
                    </div>
                    <div id="embedOutputAreas" class="space-y-4"></div>

                    <div class="flex flex-wrap justify-between items-center bg-gray-100 p-4 rounded-xl mt-6 gap-y-4">
                    <span class="text-[9px] font-bold uppercase text-gray-400">Share:</span>
                    <div class="flex gap-4">
                        <button onclick="share('x')" class="hover:opacity-60"><svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.055-4.425 5.055H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.6.75z"/></svg></button>
                        <button onclick="share('threads')" class="hover:opacity-60"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M14.88 11.53c-.07-.07-.15-.14-.24-.2s-.18-.12-.27-.16v-.01c-.13-.05-.28-.09-.43-.12s-.3-.05-.45-.06a3.31 3.31 0 0 0-.46-.03 3.1 3.1 0 0 0-.46.03c-.15.01-.3.03-.45.06s-.3.07-.43.12v.01c-.1.04-.19.09-.28.16s-.17.14-.24.21-.12.16-.16.25-.07.19-.09.29c-.01.11-.02.21-.02.32s.01.22.02.33c.02.1.05.2.09.29s.09.18.16.25.14.13.24.2.18.12.28.16v.01c.13.05.28.09.43.12s.3.05.45.06c.15.01.3.02.46.02s.31-.01.46-.02c.15-.01.3-.04.45-.06s.3-.07.43-.12v-.01c.1-.04.19-.09.28-.16s.17-.14.24-.21.12-.16.16-.25.07-.19.09-.29c.01-.11.02-.21.02-.32s-.01-.22-.02-.33a1.43 1.43 0 0 0-.09-.29c-.04-.09-.09-.18-.16-.25z"/><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm6.186 14.59c-.455.61-1.06 1.08-1.813 1.41-.75.33-1.61.5-2.583.5-1.14 0-2.08-.24-2.82-.71-.74-.47-1.11-1.21-1.11-2.21v-.01c0-1.03.38-1.78 1.14-2.26.76-.48 1.71-.72 2.85-.72.3 0 .58.01.83.03.25.02.47.05.66.09V11.1c0-.42-.1-.74-.3-.98-.2-.24-.5-.36-.91-.36-.45 0-.82.11-1.12.33s-.48.51-.55.87h-1.81c.07-.86.41-1.52 1.03-1.98.62-.46 1.44-.69 2.45-.69 1.03 0 1.83.27 2.4.82.57.55.85 1.34.85 2.37v3.7c0 .54.12.92.36 1.15.24.23.58.35 1.01.35.25 0 .48-.05.69-.15v1.49c-.18.08-.38.12-.61.12-.72 0-1.21-.29-1.48-.87z"/></svg></button>
                        <button onclick="share('facebook')" class="hover:opacity-60"><svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg></button>
                        <button onclick="share('line')" class="hover:opacity-60"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M24 10.3c0-4.6-5.4-8.3-12-8.3S0 5.7 0 10.3c0 4.1 4.3 7.5 10.1 8.2l-.7 2.3c-.1.3.1.6.4.5l6.4-3.8c4.7-1.3 7.8-4.2 7.8-7.2z"/></svg></button>
                    </div>
                </div>
                </div>
            </div>
        </div>

        <div id="playlistSection" class="mt-12 hidden border-t border-black/10 pt-8">
            <h3 class="dot-font text-[10px] uppercase mb-3 px-2 font-bold">Playlist Contents</h3>
            <div id="playlistList" class="horizontal-scroll"></div>
            <div id="playlistIndicator" class="indicator-container"></div>
        </div>

<div id="historySection" class="mt-12 hidden border-t border-black/10 pt-8">
    <h3 class="dot-font text-[10px] uppercase mb-3 px-2 font-bold">History</h3>
    <div class="relative">
        <div class="nav-btn !w-8 !h-8" style="left:-10px;" onclick="moveSlide('historyList', -1)"><div class="arrow !w-1.5 !h-1.5" style="transform:rotate(-135deg);"></div></div>
        <div class="nav-btn !w-8 !h-8" style="right:-10px;" onclick="moveSlide('historyList', 1)"><div class="arrow !w-1.5 !h-1.5" style="transform:rotate(45deg);"></div></div>

        <div id="historyList" class="horizontal-scroll"></div>
    </div>
    <div id="historyIndicator" class="indicator-container"></div>
    <div class="flex justify-end mt-4 px-2">
        <button onclick="copyAllHistory()" class="text-[9px] font-bold text-gray-400 border border-gray-300 rounded-full px-4 py-1 uppercase hover:bg-black hover:text-white transition-all">Copy All History URLs</button>
    </div>
</div>

        <footer class="mt-20 text-center pb-10">
            <a href="https://www.amazon.jp/hz/wishlist/ls/zeitgeist-22" target="_blank" class="amazon-btn mb-8">Support Project</a>
            <p class="copyright">YT_EXTRACTOR v6.9.0 // FAREASTNOISE</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
