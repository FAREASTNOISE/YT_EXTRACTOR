<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT_EXTRACTOR // PROTOCOL v4.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --grid-color: rgba(0, 0, 0, 0.05); }
        body {
            background-color: #f2f2f2; font-family: 'Inter', sans-serif; color: #000; overflow-x: hidden;
            background-image: radial-gradient(circle at center, transparent 0%, #f2f2f2 90%), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 100px 100px, 100px 100px; background-attachment: fixed;
            scroll-behavior: smooth;
        }
        .dot-font { font-family: 'Silkscreen', cursive; }
        .nothing-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 24px; }
        .nothing-input { background: rgba(0, 0, 0, 0.03); border: 1px solid transparent; border-radius: 12px; transition: all 0.2s; -webkit-appearance: none; }
        .inner-round { border-radius: 14px; }
        .scroll-item { border-radius: 18px; padding: 6px; }
        .scroll-item img { border-radius: 12px; }
        .btn-gray-copy { background-color: #eeeeee; color: #666; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 8px 16px; text-transform: uppercase; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-gray-copy:hover { background-color: #000; color: #fff; }
        .btn-black { background: #000; color: #fff; border-radius: 50px; transition: all 0.2s; }
        .tab-active { background: #000 !important; color: #fff !important; }
        .fixed-aspect { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; position: relative; }
        .slider-viewport { width: 100%; height: 100%; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
        .slider-viewport::-webkit-scrollbar { display: none; }
        .slide-item { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: start; object-fit: cover; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 20; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; border: 1px solid rgba(0,0,0,0.05); }
        .nav-btn.prev { left: -10px; } .nav-btn.next { right: -10px; }
        .arrow { width: 6px; height: 6px; border-top: 2px solid #000; border-right: 2px solid #000; }
        .indicator-container { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; height: 10px; }
        .dot { width: 6px; height: 6px; background: #ccc; border-radius: 3px; transition: all 0.3s; cursor: pointer; }
        .dot.active { width: 24px; background: #000; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; scroll-behavior: smooth; scroll-snap-type: x proximity; -ms-overflow-style: none; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .scroll-item-content { flex: 0 0 calc((100% - 20px) / 2.2); scroll-snap-align: start; cursor: pointer; }
        .checkbox-container { display: flex; align-items: center; cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #666; }
        .checkbox-container input { display: none; }
        .custom-check { width: 14px; height: 14px; border: 2px solid #ccc; border-radius: 4px; margin-right: 6px; position: relative; }
        .checkbox-container input:checked + .custom-check { background: #000; border-color: #000; }
        .checkbox-container input:checked + .custom-check::after { content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 7px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    </style>
</head>
<body class="py-12 px-4 pb-48">

    <div class="max-w-2xl mx-auto">
        <header class="mb-10 pl-2">
            <h1 class="dot-font text-2xl mb-1 tracking-tighter">YT_EXTRACTOR</h1>
            <div class="inline-block px-2 py-0.5 border border-black rounded-full">
                <p class="text-[8px] uppercase tracking-[0.2em] font-bold">Version 4.3 // Sharing & Aspect Lock</p>
            </div>
        </header>

        <div class="nothing-card p-6 mb-8">
            <div class="flex flex-col gap-4">
                <div class="relative">
                    <input type="text" id="videoUrl" placeholder="PASTE YOUTUBE URL" class="nothing-input w-full p-4 pr-24 text-sm font-mono uppercase">
                    <button id="pasteBtn" class="absolute right-2 top-2 bottom-2 px-4 bg-black text-white rounded-lg text-[9px] font-bold uppercase">Paste</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="processVideo()" class="btn-black flex-grow py-4 font-bold text-xs uppercase">Start Extraction</button>
                    <button onclick="clearInput()" class="bg-gray-200 text-gray-600 px-8 py-4 rounded-[50px] font-bold text-xs uppercase">Clear</button>
                </div>
            </div>
        </div>

        <div id="sharedSection" class="mt-8 mb-8 hidden border-t border-black/5 pt-8">
            <h3 class="dot-font text-[10px] uppercase text-red-500 mb-2 px-2 tracking-widest">Received Shared List</h3>
            <div class="history-container relative">
                <div class="nav-btn prev" onclick="scrollArea('sharedList', -1)"><div class="arrow" style="transform:rotate(-135deg); margin-left:2px;"></div></div>
                <div class="nav-btn next" onclick="scrollArea('sharedList', 1)"><div class="arrow" style="transform:rotate(45deg); margin-right:2px;"></div></div>
                <div id="sharedList" class="horizontal-scroll"></div>
                <div id="sharedIndicator" class="indicator-container"></div>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div class="flex gap-2 justify-center">
                <button id="tabThumb" onclick="switchTab('thumb')" class="nothing-card px-8 py-2 text-[10px] font-bold uppercase">Assets</button>
                <button id="tabEmbed" onclick="switchTab('embed')" class="nothing-card px-8 py-2 text-[10px] font-bold uppercase">Embed</button>
            </div>

            <div id="contentThumb" class="space-y-4">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect">
                        <div class="nav-btn prev" style="left:10px;" onclick="moveMainSlide(-1)"><div class="arrow" style="transform:rotate(-135deg); margin-left:2px;"></div></div>
                        <div class="nav-btn next" style="right:10px;" onclick="moveMainSlide(1)"><div class="arrow" style="transform:rotate(45deg); margin-right:2px;"></div></div>
                        <div class="slider-viewport" id="mainSlider"></div>
                    </div>
                    <div id="mainIndicator" class="indicator-container"></div>
                    <div id="assetMeta" class="text-center text-[9px] font-bold text-gray-400 uppercase mt-1"></div>
                </div>
                <div class="grid gap-2" id="thumbOutputs"></div>
                <button onclick="shareCurrentList()" class="btn-black w-full py-4 text-[10px] font-bold uppercase tracking-widest mt-4">Copy My History as Share Link</button>
            </div>

            <div id="contentEmbed" class="hidden space-y-6">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect"><div id="player"></div></div>
                </div>
                <div class="nothing-card p-6">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <label class="checkbox-container"><input type="checkbox" id="aspectLock" checked><span class="custom-check"></span> Lock 16:9 Aspect</label>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <div><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Width</label><input type="number" id="eWidth" value="560" oninput="resizeEmbed('w')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Height</label><input type="number" id="eHeight" value="315" oninput="resizeEmbed('h')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div class="relative"><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Start (s)</label><input type="number" id="eStart" value="0" oninput="updateEmbed()" class="nothing-input w-full p-2 text-center text-xs"><button onclick="syncTime()" class="absolute right-1 bottom-1 p-1 bg-black text-white rounded-md text-[7px] uppercase">Sync</button></div>
                    </div>

                    <div class="space-y-4">
                        <div class="nothing-card p-4 border-dashed bg-transparent">
                            <label class="text-[9px] font-bold text-gray-400 block mb-2 uppercase px-1">Short URL (youtu.be)</label>
                            <div class="flex gap-2">
                                <input type="text" id="outShortUrl" readonly class="nothing-input flex-grow p-3 text-[11px] font-mono">
                                <button onclick="copy('outShortUrl')" class="btn-gray-copy px-6">Copy</button>
                            </div>
                        </div>
                        <div class="nothing-card p-4 border-dashed bg-transparent">
                            <label class="text-[9px] font-bold text-gray-400 block mb-2 uppercase px-1">IFrame Embed Tag</label>
                            <textarea id="outIframe" readonly class="nothing-input w-full p-3 text-[10px] font-mono h-16 mb-2"></textarea>
                            <button onclick="copy('outIframe')" class="btn-gray-copy w-full">Copy IFrame</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="historySection" class="mt-12 hidden border-t border-black/5 pt-8">
            <h3 class="dot-font text-[10px] uppercase text-gray-400 mb-2 px-2 tracking-widest">My Recent History</h3>
            <div class="history-container relative">
                <div class="nav-btn prev" onclick="scrollArea('historyList', -1)"><div class="arrow" style="transform:rotate(-135deg); margin-left:2px;"></div></div>
                <div class="nav-btn next" onclick="scrollArea('historyList', 1)"><div class="arrow" style="transform:rotate(45deg); margin-right:2px;"></div></div>
                <div id="historyList" class="horizontal-scroll"></div>
                <div id="historyIndicator" class="indicator-container"></div>
            </div>
        </div>

        <div id="recommendSection" class="mt-12 hidden border-t border-black/5 pt-8">
            <h3 class="dot-font text-[10px] uppercase text-gray-400 mb-2 px-2 tracking-widest">Related Videos</h3>
            <div class="history-container relative">
                <div class="nav-btn prev" onclick="scrollArea('recommendList', -1)"><div class="arrow" style="transform:rotate(-135deg); margin-left:2px;"></div></div>
                <div class="nav-btn next" onclick="scrollArea('recommendList', 1)"><div class="arrow" style="transform:rotate(45deg); margin-right:2px;"></div></div>
                <div id="recommendList" class="horizontal-scroll"></div>
                <div id="recommendIndicator" class="indicator-container"></div>
            </div>
        </div>
    </div>

    <script>
        let player, currentVideoId = "";
        let assetList = [];

        window.onload = () => {
            loadHistory();
            checkSharedLink();
            switchTab(localStorage.getItem('yt_last_tab') || 'thumb');

            document.getElementById('mainSlider').addEventListener('scroll', () => updateDots('mainSlider', 'mainIndicator', 1));
            ['historyList', 'recommendList', 'sharedList'].forEach(id => {
                const el = document.getElementById(id);
                if(el) el.addEventListener('scroll', () => updateDots(id, id.replace('List', 'Indicator'), 0.42));
            });

            document.getElementById('pasteBtn').addEventListener('click', async () => {
                const text = await navigator.clipboard.readText();
                if (text) { document.getElementById('videoUrl').value = text; processVideo(); }
            });
        };

        function checkSharedLink() {
            const params = new URLSearchParams(window.location.search);
            const list = params.get('list');
            if (list) {
                const ids = list.split(',');
                document.getElementById('sharedSection').classList.remove('hidden');
                const scrollList = document.getElementById('sharedList');
                scrollList.innerHTML = ids.map(id => `<div class="scroll-item-content scroll-item nothing-card" onclick="loadVideo('${id}')"><img src="https://img.youtube.com/vi/${id}/mqdefault.jpg"></div>`).join('');
                document.getElementById('sharedIndicator').innerHTML = ids.map((_, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('');
            }
        }

        function shareCurrentList() {
            const history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            if (history.length === 0) return alert("No history to share.");
            const shareUrl = `${window.location.origin}${window.location.pathname}?list=${history.join(',')}`;
            navigator.clipboard.writeText(shareUrl).then(() => alert("Shared Link Copied!"));
        }

        function scrollArea(id, dir) {
            const el = document.getElementById(id);
            el.scrollBy({ left: dir * (el.clientWidth * 0.5), behavior: 'smooth' });
        }

        function moveMainSlide(dir) {
            const el = document.getElementById('mainSlider');
            el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' });
        }

        function updateDots(scrollId, indicatorId, ratio) {
            const list = document.getElementById(scrollId);
            const dots = document.querySelectorAll(`#${indicatorId} .dot`);
            if(!dots.length || !list) return;
            const activeIndex = Math.round(list.scrollLeft / (list.clientWidth * ratio));
            dots.forEach((dot, i) => dot.classList.toggle('active', i === activeIndex));
            if(scrollId === 'mainSlider' && assetList[activeIndex]) {
                document.getElementById('assetMeta').innerText = `${assetList[activeIndex].label} // ${assetList[activeIndex].res}`;
                updateOutputs(assetList[activeIndex].url);
            }
        }

        function switchTab(type) {
            const isThumb = type === 'thumb';
            document.getElementById('tabThumb').className = `nothing-card px-8 py-2 text-[10px] font-bold uppercase ${isThumb?'tab-active':'text-gray-400'}`;
            document.getElementById('tabEmbed').className = `nothing-card px-8 py-2 text-[10px] font-bold uppercase ${!isThumb?'tab-active':'text-gray-400'}`;
            document.getElementById('contentThumb').classList.toggle('hidden', !isThumb);
            document.getElementById('contentEmbed').classList.toggle('hidden', isThumb);
            localStorage.setItem('yt_last_tab', type);
        }

        function processVideo(vid = null) {
            currentVideoId = vid || extractVideoId(document.getElementById('videoUrl').value);
            if (!currentVideoId) return;
            saveHistory(currentVideoId);
            loadRecommendations(currentVideoId);
            document.getElementById('resultArea').classList.remove('hidden');

            assetList = [
                { label: 'Max Resolution', res: '1280x720', url: `https://img.youtube.com/vi/${currentVideoId}/maxresdefault.jpg` },
                { label: 'High Quality', res: '480x360', url: `https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg` },
                { label: 'Medium Quality', res: '320x180', url: `https://img.youtube.com/vi/${currentVideoId}/mqdefault.jpg` },
                { label: 'Scene 1', res: '120x90', url: `https://img.youtube.com/vi/${currentVideoId}/1.jpg` },
                { label: 'Scene 2', res: '120x90', url: `https://img.youtube.com/vi/${currentVideoId}/2.jpg` },
                { label: 'Scene 3', res: '120x90', url: `https://img.youtube.com/vi/${currentVideoId}/3.jpg` }
            ];

            const slider = document.getElementById('mainSlider');
            slider.innerHTML = assetList.map(a => `<img src="${a.url}" class="slide-item" onerror="this.src='https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg'">`).join('');
            document.getElementById('mainIndicator').innerHTML = assetList.map((_, i) => `<div class="dot ${i===0?'active':''}" onclick="document.getElementById('mainSlider').scrollTo({left:${i*slider.clientWidth},behavior:'smooth'})"></div>`).join('');

            if (player && player.loadVideoById) player.loadVideoById(currentVideoId);
            else player = new YT.Player('player', { height: '100%', width: '100%', videoId: currentVideoId });

            updateDots('mainSlider', 'mainIndicator', 1);
            updateEmbed();
        }

        function loadVideo(id) { document.getElementById('videoUrl').value = `https://www.youtube.com/watch?v=${id}`; processVideo(id); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function updateOutputs(url) {
            document.getElementById('thumbOutputs').innerHTML = `
                ${createCopyRow('Markdown', `[![](${url})](https://www.youtube.com/watch?v=${currentVideoId})`, 'outMd')}
                ${createCopyRow('HTML Tag', `<a href="https://www.youtube.com/watch?v=${currentVideoId}"><img src="${url}"></a>`, 'outHtml')}
                ${createCopyRow('Image URL', url, 'outUrl')}
            `;
        }

        function createCopyRow(label, value, id) {
            return `<div class="nothing-card p-4 flex items-center justify-between">
                <div class="flex-1 mr-4 text-[10px] font-mono"><span class="text-gray-400 block mb-1 uppercase font-bold">${label}</span><input type="text" id="${id}" value='${value}' readonly class="w-full bg-transparent outline-none"></div>
                <button onclick="copy('${id}')" class="btn-gray-copy">Copy</button>
            </div>`;
        }

        function loadRecommendations(id) {
            const list = document.getElementById('recommendList');
            document.getElementById('recommendSection').classList.remove('hidden');
            const dummySuffix = ['-XjS6eU0Y_E', 'dQw4w9WgXcQ', '3JZ_D3ELwOQ', '2Vv-BfVoq4g', 'YykjpeuMNEk', 'JGwWNGJdvx8', '9bZkp7q19f0', 'L_jWHffIx5E', 'tVlcKp3bWH8', '09R8_2nJtjg'];
            list.innerHTML = dummySuffix.map(sid => `<div class="scroll-item-content scroll-item nothing-card" onclick="loadVideo('${sid}')"><img src="https://img.youtube.com/vi/${sid}/mqdefault.jpg"></div>`).join('');
            document.getElementById('recommendIndicator').innerHTML = dummySuffix.map((_, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('');
        }

        function saveHistory(id) {
            let history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            history = [id, ...history.filter(x => x !== id)].slice(0, 10);
            localStorage.setItem('yt_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            const list = document.getElementById('historyList');
            if (history.length === 0) return;
            document.getElementById('historySection').classList.remove('hidden');
            list.innerHTML = history.map(id => `<div class="scroll-item-content scroll-item nothing-card" onclick="loadVideo('${id}')"><img src="https://img.youtube.com/vi/${id}/mqdefault.jpg"></div>`).join('');
            document.getElementById('historyIndicator').innerHTML = history.map((_, i) => `<div class="dot ${i===0?'active':''}"></div>`).join('');
        }

        function extractVideoId(url) {
            const match = url.match(/^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function copy(id) {
            const el = document.getElementById(id);
            await navigator.clipboard.writeText(el.value);
            const btn = event.currentTarget;
            const old = btn.innerText; btn.innerText = "DONE";
            setTimeout(() => btn.innerText = old, 1000);
        }

        function resizeEmbed(source) {
            const isLocked = document.getElementById('aspectLock').checked;
            const w = document.getElementById('eWidth'), h = document.getElementById('eHeight');
            if (isLocked) source === 'w' ? h.value = Math.round(w.value * 9/16) : w.value = Math.round(h.value * 16/9);
            updateEmbed();
        }

        function updateEmbed() {
            if (!currentVideoId) return;
            const w = document.getElementById('eWidth').value, h = document.getElementById('eHeight').value, s = document.getElementById('eStart').value;
            document.getElementById('outIframe').value = `<iframe width="${w}" height="${h}" src="https://www.youtube.com/embed/${currentVideoId}?rel=0${s>0?'&start='+s:''}" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('outShortUrl').value = `https://youtu.be/${currentVideoId}${s>0?'?t='+s:''}`;
        }

        function syncTime() { if (player && player.getCurrentTime) { document.getElementById('eStart').value = Math.floor(player.getCurrentTime()); updateEmbed(); } }
        function clearInput() { document.getElementById('videoUrl').value = ''; document.getElementById('resultArea').classList.add('hidden'); }
    </script>
</body>
</html>
