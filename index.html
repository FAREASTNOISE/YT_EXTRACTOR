<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT_EXTRACTOR // PROTOCOL v6.6.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --grid-color: rgba(0, 0, 0, 0.05); }
        body {
            background-color: #f2f2f2; font-family: 'Inter', sans-serif; color: #000;
            background-image: radial-gradient(circle at center, transparent 0%, #f2f2f2 90%), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 100px 100px, 100px 100px; background-attachment: fixed;
        }
        .dot-font { font-family: 'Silkscreen', cursive; }
        .nothing-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 24px; position: relative; overflow: hidden; }
        .item-card { background: #fff; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; padding: 4px; transition: transform 0.2s; cursor: pointer; }
        .item-card:hover { transform: translateY(-2px); }
        .nothing-input { background: rgba(0, 0, 0, 0.03); border: 1px solid transparent; border-radius: 12px; transition: all 0.2s; }
        .btn-black-rect { background: #000; color: #fff; border-radius: 12px; font-size: 11px; font-weight: 700; padding: 16px; width: 100%; text-transform: uppercase; }
        .btn-gray-copy { background-color: #eeeeee; color: #666; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 8px 16px; text-transform: uppercase; border: none; cursor: pointer; }
        .amazon-btn { background: linear-gradient(to bottom, #f7dfa5, #f0c14b); border: 1px solid #a88734; border-radius: 50px; color: #111; padding: 10px 24px; font-size: 10px; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset; }

        /* Layout */
        .fixed-aspect { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; position: relative; }
        .slider-viewport { width: 100%; height: 100%; overflow-x: auto; display: flex; scroll-snap-type: x mandatory; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
        .slider-viewport::-webkit-scrollbar { display: none; }

        /* Centering Asset Rule */
        .slide-item-container { flex: 0 0 100%; width: 100%; height: 100%; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; }
        .slide-item-fit { max-width: 100%; max-height: 100%; object-fit: contain; }
        .slide-item-natural { width: auto; height: auto; object-fit: none; }

        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; background: rgba(255,255,255,0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 40; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; border: 1px solid rgba(0,0,0,0.05); }
        .arrow { width: 6px; height: 6px; border-top: 2px solid #000; border-right: 2px solid #000; }
        .indicator-container { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; height: 10px; }
        .dot { width: 6px; height: 6px; background: #ccc; border-radius: 3px; cursor: pointer; transition: all 0.3s; }
        .dot.active { width: 20px; background: #000; }
        .horizontal-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 8px; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
        .scroll-item-content { flex: 0 0 calc((100% - 24px) / 2.6); scroll-snap-align: start; position: relative; }
        .tab-active { background: #000 !important; color: #fff !important; }
        .btn-history-copy { background: #e0e0e0; color: #777; border-radius: 6px; font-size: 9px; font-weight: 700; padding: 6px 12px; text-transform: uppercase; }
        footer .copyright { font-family: 'Silkscreen', cursive; font-size: 8px; letter-spacing: 0.1em; color: #888; }
    </style>
</head>
<body class="py-12 px-4">

    <div class="max-w-2xl mx-auto">
        <header class="mb-10 pl-2">
            <h1 onclick="clearInput()" class="dot-font text-2xl mb-1 tracking-tighter cursor-pointer">YT_EXTRACTOR</h1>
            <div class="inline-block px-2 py-0.5 border border-black rounded-full">
                <p class="text-[8px] uppercase tracking-[0.2em] font-bold">Version 6.6.8 // Complete Revival</p>
            </div>
        </header>

        <div class="nothing-card p-6 mb-8">
            <div class="flex flex-col gap-4">
                <div class="relative">
                    <input type="text" id="videoUrl" placeholder="PASTE YOUTUBE URL OR PLAYLIST..." class="nothing-input w-full p-4 pr-24 text-sm font-mono uppercase focus:outline-none">
                    <button id="pasteBtn" class="absolute right-2 top-2 bottom-2 px-4 bg-black text-white rounded-lg text-[9px] font-bold uppercase">Paste</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="processInput()" class="btn-black-rect flex-grow !rounded-[50px]">Start Extraction</button>
                    <button onclick="clearInput()" class="bg-gray-200 text-gray-600 px-8 py-4 rounded-[50px] font-bold text-xs uppercase">Clear</button>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div class="flex gap-2 justify-center">
                <button id="tabThumb" onclick="switchTab('thumb')" class="nothing-card px-6 py-2 text-[10px] font-bold uppercase flex items-center gap-2">
                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/><path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z"/></svg>
                    Assets
                </button>
                <button id="tabEmbed" onclick="switchTab('embed')" class="nothing-card px-6 py-2 text-[10px] font-bold uppercase flex items-center gap-2">
                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16"><path d="M10.478 1.647a.5.5 0 1 0-.956-.294l-4 13a.5.5 0 0 0 .956.294l4-13zM4.854 4.146a.5.5 0 0 1 0 .708L1.707 8l3.147 3.146a.5.5 0 0 1-.708.708l-3.5-3.5a.5.5 0 0 1 0-.708l3.5-3.5a.5.5 0 0 1 .708 0zm6.292 0a.5.5 0 0 0 0 .708L14.293 8l-3.147 3.146a.5.5 0 0 0 .708.708l3.5-3.5a.5.5 0 0 0 0-.708l-3.5-3.5a.5.5 0 0 0-.708 0z"/></svg>
                    Embed
                </button>
            </div>

            <div id="contentThumb" class="space-y-4">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect">
                        <div class="nav-btn" style="left:10px;" onclick="moveSlide('mainSlider', -1)"><div class="arrow" style="transform:rotate(-135deg);"></div></div>
                        <div class="nav-btn" style="right:10px;" onclick="moveSlide('mainSlider', 1)"><div class="arrow" style="transform:rotate(45deg);"></div></div>
                        <div class="slider-viewport" id="mainSlider"></div>
                    </div>
                    <div id="mainIndicator" class="indicator-container"></div>
                    <div id="assetMeta" class="text-center text-[9px] font-bold text-gray-400 uppercase mt-1"></div>
                </div>
                <div id="thumbOutputs"></div>
            </div>

            <div id="contentEmbed" class="hidden space-y-6">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect">
                        <div id="player-wrapper" class="w-full h-full"><div id="player"></div></div>
                    </div>
                </div>
                <div class="nothing-card p-6">
                    <div class="flex items-center gap-2 mb-4">
                        <input type="checkbox" id="keepAspect" checked class="w-4 h-4 accent-black">
                        <label for="keepAspect" class="text-[10px] font-bold uppercase">Keep 16:9 Aspect Ratio</label>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <div><label class="text-[9px] text-gray-400 block mb-1 uppercase text-center">Width</label><input type="number" id="eWidth" value="560" oninput="resizeEmbed('w')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div><label class="text-[9px] text-gray-400 block mb-1 uppercase text-center">Height</label><input type="number" id="eHeight" value="315" oninput="resizeEmbed('h')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div class="relative"><label class="text-[9px] text-gray-400 block mb-1 uppercase text-center">Start (sec)</label><input type="number" id="eStart" value="0" oninput="updateEmbedOutputs()" class="nothing-input w-full p-2 text-center text-xs"><button onclick="syncTime()" class="absolute right-1 bottom-1 p-1 bg-black text-white rounded text-[7px]">SYNC</button></div>
                    </div>
                    <div class="space-y-4 mb-6">
                        <div class="nothing-card p-4 border-dashed bg-transparent">
                            <label class="text-[9px] text-gray-400 block mb-2 uppercase font-bold">iframe embed tag</label>
                            <textarea id="outIframe" readonly class="nothing-input w-full p-3 text-[10px] font-mono h-16 mb-2 focus:outline-none"></textarea>
                            <button onclick="copy('outIframe')" class="btn-black-rect">Copy IFrame Tag</button>
                        </div>
                        <div class="nothing-card p-4 border-dashed bg-transparent">
                            <label class="text-[9px] text-gray-400 block mb-2 uppercase font-bold">Short URL (youtu.be)</label>
                            <div class="flex gap-2">
                                <input type="text" id="outShortUrl" readonly class="nothing-input flex-grow p-3 text-[11px] font-mono focus:outline-none">
                                <button onclick="copyRaw(this)" class="btn-gray-copy px-6">Copy</button>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center bg-gray-100 p-4 rounded-xl">
                        <span class="text-[9px] font-bold uppercase text-gray-400">Share:</span>
                        <div class="flex gap-4">
                            <button onclick="share('x')" class="text-black hover:opacity-60"><svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.055-4.425 5.055H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.6.75zm-.86 13.028h1.36L4.323 2.145H2.865l8.875 11.633z"/></svg></button>
                            <button onclick="share('fb')" class="text-black hover:opacity-60"><svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/></svg></button>
                            <button onclick="share('line')" class="text-black hover:opacity-60"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M24 10.3c0-4.6-5.4-8.3-12-8.3S0 5.7 0 10.3c0 4.1 4.3 7.5 10.1 8.2l-.7 2.3c-.1.3.1.6.4.5l6.4-3.8c4.7-1.3 7.8-4.2 7.8-7.2z"/></svg></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="playlistSection" class="mt-12 hidden border-t border-black/10 pt-8 relative">
            <h3 class="dot-font text-[10px] uppercase text-black mb-3 px-2 tracking-widest font-bold">Playlist Contents</h3>
            <div class="relative group">
                <div class="nav-btn -left-2" onclick="moveSlide('playlistList', -1)"><div class="arrow" style="transform:rotate(-135deg);"></div></div>
                <div class="nav-btn -right-2" onclick="moveSlide('playlistList', 1)"><div class="arrow" style="transform:rotate(45deg);"></div></div>
                <div id="playlistList" class="horizontal-scroll"></div>
            </div>
            <div id="playlistIndicator" class="indicator-container"></div>
        </div>

        <div id="historySection" class="mt-12 hidden border-t border-black/10 pt-8">
            <h3 class="dot-font text-[10px] uppercase text-black mb-3 px-2 tracking-widest font-bold">History</h3>
            <div class="relative group">
                <div class="nav-btn -left-2" onclick="moveSlide('historyList', -1)"><div class="arrow" style="transform:rotate(-135deg);"></div></div>
                <div class="nav-btn -right-2" onclick="moveSlide('historyList', 1)"><div class="arrow" style="transform:rotate(45deg);"></div></div>
                <div id="historyList" class="horizontal-scroll"></div>
            </div>
            <div id="historyIndicator" class="indicator-container"></div>
            <div class="flex justify-end mt-4 px-2">
                <button onclick="copyAllHistory()" class="btn-history-copy">Copy All History URL</button>
            </div>
        </div>

        <footer class="mt-20 text-center pb-10">
            <a href="https://www.amazon.jp/hz/wishlist/ls/zeitgeist-22" target="_blank" class="amazon-btn mb-8">Support Project via Amazon</a>
            <p class="copyright">YT_EXTRACTOR v6.6.8 // FAREASTNOISE</p>
        </footer>
    </div>

    <script>
        let player, currentVideoId = "", assetList = [], currentImgUrl = "", apiReady = false;
        function onYouTubeIframeAPIReady() { apiReady = true; }

        window.onload = () => {
            loadHistory();
            switchTab(localStorage.getItem('yt_last_tab') || 'thumb');
            document.getElementById('mainSlider').addEventListener('scroll', () => updateDots('mainSlider', 'mainIndicator', 1));
            document.getElementById('historyList').addEventListener('scroll', () => updateDots('historyList', 'historyIndicator', 0.4));
            document.getElementById('playlistList').addEventListener('scroll', () => updateDots('playlistList', 'playlistIndicator', 0.4));
            document.getElementById('pasteBtn').onclick = async () => {
                const t = await navigator.clipboard.readText(); if(t){ document.getElementById('videoUrl').value=t; processInput(); }
            };
        };

        function processInput() {
            const url = document.getElementById('videoUrl').value.trim();
            const playlistId = url.match(/[?&]list=([^#& ]+)/);
            const videoId = url.match(/^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]{11}).*/);
            if (playlistId) fetchPlaylist(playlistId[1]);
            else if (videoId) loadVideo(videoId[2], true);
        }

        async function loadVideo(id, shouldScroll) {
            if (!id || id === currentVideoId) return;
            currentVideoId = id; saveHistory(id);
            document.getElementById('resultArea').classList.remove('hidden');
            if (player && player.loadVideoById) player.loadVideoById(id);
            else { resetPlayer(); player = new YT.Player('player', { height:'100%', width:'100%', videoId:id }); }

            const cands = [
                { label: 'Max Res', res: '1280x720', url: `https://img.youtube.com/vi/${id}/maxresdefault.jpg`, isScene: false },
                { label: 'HQ', res: '480x360', url: `https://img.youtube.com/vi/${id}/hqdefault.jpg`, isScene: false },
                { label: 'MQ', res: '320x180', url: `https://img.youtube.com/vi/${id}/mqdefault.jpg`, isScene: false },
                { label: 'Scene 1', res: 'Storyboard', url: `https://img.youtube.com/vi/${id}/1.jpg`, isScene: true },
                { label: 'Scene 2', res: 'Storyboard', url: `https://img.youtube.com/vi/${id}/2.jpg`, isScene: true },
                { label: 'Scene 3', res: 'Storyboard', url: `https://img.youtube.com/vi/${id}/3.jpg`, isScene: true }
            ];

            assetList = [];
            for (const c of cands) {
                const ok = await new Promise(r => {
                    const img = new Image();
                    img.onload = () => r(img.width > 1);
                    img.onerror = () => r(false);
                    img.src = c.url;
                });
                if (ok) assetList.push(c);
            }
            const s = document.getElementById('mainSlider');
            s.innerHTML = assetList.map(a => `<div class="slide-item-container"><img src="${a.url}" class="${a.isScene ? 'slide-item-natural' : 'slide-item-fit'}"></div>`).join('');
            s.scrollTo(0,0); updateDots('mainSlider', 'mainIndicator', 1); updateEmbedOutputs();
            if(shouldScroll) document.getElementById('resultArea').scrollIntoView({behavior:'smooth'});
        }

        function updateDots(sId, iId, r) {
            const l = document.getElementById(sId); if(!l) return;
            const step = l.clientWidth * (r || 1);
            const totalItems = (sId === 'mainSlider' ? assetList.length : l.children.length);
            const idx = Math.min(Math.round(l.scrollLeft / step), totalItems - 1);
            const dContainer = document.getElementById(iId);

            if(sId === 'mainSlider') {
                dContainer.innerHTML = assetList.map((_, i) => `<div class="dot ${i===idx?'active':''}" onclick="document.getElementById('mainSlider').scrollTo({left:${i*l.clientWidth},behavior:'smooth'})"></div>`).join('');
                if(assetList[idx]) {
                    currentImgUrl = assetList[idx].url;
                    document.getElementById('assetMeta').innerText = `${assetList[idx].label} // ${assetList[idx].res}`;
                    const tag = `<a href="https://www.youtube.com/watch?v=${currentVideoId}"><img src="${currentImgUrl}"></a>`;
                    document.getElementById('thumbOutputs').innerHTML = `
                        <div class="nothing-card p-4 space-y-4">
                            <div><label class="text-[9px] text-gray-400 block mb-1 uppercase font-bold">Markdown</label><div class="flex gap-2"><input type="text" value='[![](${currentImgUrl})](https://www.youtube.com/watch?v=${currentVideoId})' readonly class="nothing-input flex-grow p-2 text-[10px] font-mono"><button onclick="copyRaw(this)" class="btn-gray-copy">Copy</button></div></div>
                            <div><label class="text-[9px] text-gray-400 block mb-1 uppercase font-bold">HTML Tag</label><div class="flex gap-2"><input type="text" value='${tag.replace(/'/g, "&apos;")}' readonly class="nothing-input flex-grow p-2 text-[10px] font-mono"><button onclick="copyRaw(this)" class="btn-gray-copy">Copy</button></div></div>
                            <div><label class="text-[9px] text-gray-400 block mb-1 uppercase font-bold">Direct URL</label><div class="flex gap-2"><input type="text" value='${currentImgUrl}' readonly class="nothing-input flex-grow p-2 text-[10px] font-mono"><button onclick="copyRaw(this)" class="btn-gray-copy">Copy</button></div></div>
                        </div>`;
                }
            } else {
                dContainer.innerHTML = Array.from({length: l.children.length}).map((_, i) => `<div class="dot ${i===idx?'active':''}" onclick="document.getElementById('${sId}').scrollTo({left:${i*step},behavior:'smooth'})"></div>`).join('');
            }
        }

        function resizeEmbed(type) {
            const w = document.getElementById('eWidth'), h = document.getElementById('eHeight');
            if(document.getElementById('keepAspect').checked) { if(type === 'w') h.value = Math.round(w.value * 9/16); else w.value = Math.round(h.value * 16/9); }
            updateEmbedOutputs();
        }

        function updateEmbedOutputs() {
            if(!currentVideoId) return;
            const w = document.getElementById('eWidth').value, h = document.getElementById('eHeight').value, s = document.getElementById('eStart').value;
            document.getElementById('outIframe').value = `<iframe width="${w}" height="${h}" src="https://www.youtube.com/embed/${currentVideoId}?rel=0${s>0?'&start='+s:''}" frameborder="0" allowfullscreen></iframe>`;
            document.getElementById('outShortUrl').value = `https://youtu.be/${currentVideoId}${s>0?'?t='+s:''}`;
        }

        function fetchPlaylist(listId) {
            const listEl = document.getElementById('playlistList');
            document.getElementById('playlistSection').classList.remove('hidden');
            listEl.innerHTML = '<div class="p-10 text-center w-full text-[10px] uppercase text-gray-400">Loading...</div>';
            resetPlayer();
            player = new YT.Player('player', { height: '100%', width: '100%', playerVars: { listType: 'playlist', list: listId },
                events: { 'onReady': (e) => {
                    const ids = e.target.getPlaylist();
                    if (ids && ids.length) {
                        listEl.innerHTML = ids.slice(0, 50).map(id => `<div class="scroll-item-content item-card" onclick="loadVideo('${id}', true)"><img src="https://img.youtube.com/vi/${id}/mqdefault.jpg" class="w-full rounded-lg"></div>`).join('');
                        updateDots('playlistList', 'playlistIndicator', 0.4); loadVideo(ids[0], false);
                    }
                }}
            });
            document.getElementById('resultArea').classList.remove('hidden');
        }

        function saveHistory(id) { let h = JSON.parse(localStorage.getItem('yt_history') || '[]'); h = [id, ...h.filter(x => x !== id)].slice(0, 15); localStorage.setItem('yt_history', JSON.stringify(h)); loadHistory(); }
        function loadHistory() { const h = JSON.parse(localStorage.getItem('yt_history') || '[]'); if(!h.length) return; document.getElementById('historySection').classList.remove('hidden'); document.getElementById('historyList').innerHTML = h.map(id => `<div class="scroll-item-content item-card"><div class="absolute top-1 right-1 bg-gray-400 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center cursor-pointer z-10" onclick="event.stopPropagation();removeHistory('${id}')">×</div><img src="https://img.youtube.com/vi/${id}/mqdefault.jpg" onclick="loadVideo('${id}', true)" class="w-full rounded-lg"></div>`).join(''); updateDots('historyList', 'historyIndicator', 0.4); }
        function removeHistory(id) { let h = JSON.parse(localStorage.getItem('yt_history') || '[]'); localStorage.setItem('yt_history', JSON.stringify(h.filter(x => x !== id))); loadHistory(); }
        function resetPlayer() { if(player) { try{player.destroy();}catch(e){} } document.getElementById('player-wrapper').innerHTML = '<div id="player"></div>'; }
        function clearInput() { document.getElementById('videoUrl').value = ""; document.getElementById('resultArea').classList.add('hidden'); document.getElementById('playlistSection').classList.add('hidden'); currentVideoId = ""; }
        async function copyRaw(btn) { await navigator.clipboard.writeText(btn.previousElementSibling.value); const old = btn.innerText; btn.innerText="DONE"; setTimeout(()=>btn.innerText=old, 1000); }
        async function copy(id) { await navigator.clipboard.writeText(document.getElementById(id).value); const b = event.currentTarget; const old=b.innerText; b.innerText="COPIED"; setTimeout(()=>b.innerText=old, 1000); }
        function moveSlide(id, d) { const s=document.getElementById(id); s.scrollBy({left:d*(s.clientWidth*0.8), behavior:'smooth'}); }
        function syncTime() { if(player && player.getCurrentTime) { document.getElementById('eStart').value = Math.floor(player.getCurrentTime()); updateEmbedOutputs(); } }
        function switchTab(t) { document.getElementById('tabThumb').classList.toggle('tab-active', t==='thumb'); document.getElementById('tabEmbed').classList.toggle('tab-active', t==='embed'); document.getElementById('contentThumb').classList.toggle('hidden', t!=='thumb'); document.getElementById('contentEmbed').classList.toggle('hidden', t!=='embed'); localStorage.setItem('yt_last_tab', t); }
        function share(p) { const url = encodeURIComponent(document.getElementById('outShortUrl').value); if (p === 'x') window.open(`https://twitter.com/intent/tweet?url=${url}`, '_blank'); else if (p === 'fb') window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank'); else if (p === 'line') window.open(`https://line.me/R/msg/text/?${url}`, '_blank'); }
        function copyAllHistory() { const h = JSON.parse(localStorage.getItem('yt_history') || '[]'); navigator.clipboard.writeText(h.map(id => `https://youtu.be/${id}`).join('\n')); const b=event.currentTarget; const old=b.innerText; b.innerText="COPIED!"; setTimeout(()=>b.innerText=old, 1500); }
    </script>
</body>
</html>
