<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YT_EXTRACTOR // PROTOCOL v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --grid-color: rgba(0, 0, 0, 0.05); }
        body {
            background-color: #f2f2f2; font-family: 'Inter', sans-serif; color: #000; overflow-x: hidden;
            background-image: radial-gradient(circle at center, transparent 0%, #f2f2f2 90%), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 100px 100px, 100px 100px; background-attachment: fixed;
            scroll-behavior: smooth;
        }
        .dot-font { font-family: 'Silkscreen', cursive; }
        .nothing-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 24px; }
        .nothing-input { background: rgba(0, 0, 0, 0.03); border: 1px solid transparent; border-radius: 12px; transition: all 0.2s; -webkit-appearance: none; }
        .nothing-input:focus { background: #fff; border-color: #000; outline: none; }

        /* Nothingスタイル コピーボタン */
        .btn-gray-copy { background-color: #eeeeee; color: #666; border-radius: 10px; font-size: 10px; font-weight: 700; padding: 8px 16px; text-transform: uppercase; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-gray-copy:hover { background-color: #000; color: #fff; }

        .btn-black { background: #000; color: #fff; border-radius: 50px; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        .btn-black:active { transform: scale(0.98); }
        .tab-active { background: #000 !important; color: #fff !important; }

        /* 画像比率維持 */
        .fixed-aspect { width: 100%; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #000; }
        .slider-track { display: flex; transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1); }
        .slide-item { min-width: 100%; aspect-ratio: 16 / 9; object-fit: cover; flex-shrink: 0; }

        /* 履歴コンテナ (2.5個並び) */
        .history-container { position: relative; width: 100%; }
        .history-scroll {
            display: flex; overflow-x: auto; gap: 12px; padding: 10px 0;
            scroll-behavior: smooth; scroll-snap-type: x proximity;
            -ms-overflow-style: none; scrollbar-width: none;
            touch-action: pan-x;
        }
        .history-scroll::-webkit-scrollbar { display: none; }
        .history-item { min-width: 40%; scroll-snap-align: start; cursor: pointer; flex-shrink: 0; }
        .history-item img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 14px; pointer-events: none; }

        /* 矢印ナビ */
        .hist-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; background: rgba(255,255,255,0.8);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 30; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        @media (hover: hover) { .history-container:hover .hist-nav { opacity: 1; pointer-events: auto; } }
        .arrow { width: 8px; height: 8px; border-top: 2px solid #000; border-right: 2px solid #000; }
        .arrow-left { transform: rotate(-135deg); margin-left: 3px; }
        .arrow-right { transform: rotate(45deg); margin-right: 3px; }
        .hist-nav.prev { left: -15px; }
        .hist-nav.next { right: -15px; }

        /* 比率固定チェックボックス */
        .checkbox-container { display: flex; align-items: center; cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #666; }
        .checkbox-container input { display: none; }
        .custom-check { width: 14px; height: 14px; border: 2px solid #ccc; border-radius: 4px; margin-right: 6px; position: relative; }
        .checkbox-container input:checked + .custom-check { background: #000; border-color: #000; }
        .checkbox-container input:checked + .custom-check::after { content: ''; position: absolute; left: 3px; top: 0px; width: 4px; height: 7px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    </style>
</head>
<body class="py-12 px-4 pb-48">

    <div class="max-w-2xl mx-auto">
        <header id="top" class="mb-10 pl-2">
            <h1 class="dot-font text-2xl mb-1 tracking-tighter">YT_EXTRACTOR</h1>
            <div class="inline-block px-2 py-0.5 border border-black rounded-full">
                <p class="text-[8px] uppercase tracking-[0.2em] font-bold">Version 3.1 // History Finalized</p>
            </div>
        </header>

        <div class="nothing-card p-6 mb-8">
            <div class="flex flex-col gap-4">
                <div class="relative">
                    <input type="text" id="videoUrl" placeholder="PASTE YOUTUBE URL" class="nothing-input w-full p-4 pr-24 text-sm font-mono uppercase">
                    <button id="pasteBtn" class="absolute right-2 top-2 bottom-2 px-4 bg-black text-white rounded-lg text-[9px] font-bold uppercase">Paste</button>
                </div>
                <div class="flex gap-2">
                    <button onclick="processVideo()" class="btn-black flex-grow py-4 font-bold text-xs uppercase">Start Extraction</button>
                    <button onclick="clearInput()" class="bg-gray-200 text-gray-600 px-8 py-4 rounded-[50px] font-bold text-xs uppercase">Clear</button>
                </div>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-6">
            <div class="flex gap-2 justify-center">
                <button id="tabThumb" onclick="switchTab('thumb')" class="nothing-card px-8 py-2 text-[10px] font-bold uppercase tab-active">Assets</button>
                <button id="tabEmbed" onclick="switchTab('embed')" class="nothing-card px-8 py-2 text-[10px] font-bold uppercase text-gray-400">Embed</button>
            </div>

            <div id="contentThumb" class="space-y-4">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect overflow-hidden"><div class="slider-track" id="sliderTrack"></div></div>
                    <div class="flex justify-center gap-2 py-3" id="sliderDots"></div>
                </div>
                <div class="grid gap-2" id="thumbOutputs"></div>
            </div>

            <div id="contentEmbed" class="hidden space-y-6">
                <div class="nothing-card p-2 relative">
                    <div class="fixed-aspect"><div class="video-wrapper" style="position:relative; width:100%; height:100%;"><div id="player" style="position:absolute; top:0; left:0; width:100%; height:100%;"></div></div></div>
                </div>
                <div class="nothing-card p-6">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <label class="checkbox-container"><input type="checkbox" id="aspectLock" checked><span class="custom-check"></span> Lock 16:9 Aspect</label>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <div><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Width</label><input type="number" id="eWidth" value="560" oninput="resizeEmbed('w')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Height</label><input type="number" id="eHeight" value="315" oninput="resizeEmbed('h')" class="nothing-input w-full p-2 text-center text-xs"></div>
                        <div class="relative"><label class="text-[9px] font-bold text-gray-400 block mb-1 uppercase">Start (s)</label><input type="number" id="eStart" value="0" oninput="updateEmbed()" class="nothing-input w-full p-2 text-center text-xs"><button onclick="syncTime()" class="absolute right-1 bottom-1 p-1 bg-black text-white rounded-md text-[7px] uppercase">Sync</button></div>
                    </div>
                    <textarea id="outIframe" readonly class="nothing-input w-full p-4 text-[10px] font-mono mb-4 h-20 border-dashed border-gray-300"></textarea>
                    <button onclick="copy('outIframe')" class="btn-gray-copy w-full py-4 text-xs">Copy IFrame Tag</button>
                </div>
            </div>
        </div>

        <div id="historySection" class="mt-12 hidden border-t border-black/5 pt-8">
            <h3 class="dot-font text-[10px] uppercase text-gray-400 mb-2 px-2 tracking-widest flex justify-between">
                <span>Recent History</span>
            </h3>
            <div class="history-container">
                <div class="hist-nav prev" onclick="scrollHist(-1)"><div class="arrow arrow-left"></div></div>
                <div class="hist-nav next" onclick="scrollHist(1)"><div class="arrow arrow-right"></div></div>
                <div class="history-scroll" id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        let player, currentVideoId = "";

        window.onload = () => {
            loadHistory();
            setupWheelScroll();
            showScrollHint();

            document.getElementById('pasteBtn').addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text) { document.getElementById('videoUrl').value = text; processVideo(); }
                } catch (err) { console.log("Clipboard access denied."); }
            });
        };

        function setupWheelScroll() {
            const list = document.getElementById('historyList');
            list.addEventListener('wheel', (e) => {
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); list.scrollLeft += e.deltaY; }
            }, { passive: false });
        }

        function showScrollHint() {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            if (history.length > 2) {
                setTimeout(() => {
                    list.scrollBy({ left: 60, behavior: 'smooth' });
                    setTimeout(() => list.scrollTo({ left: 0, behavior: 'smooth' }), 500);
                }, 800);
            }
        }

        function scrollHist(dir) {
            const list = document.getElementById('historyList');
            list.scrollBy({ left: dir * (list.clientWidth * 0.7), behavior: 'smooth' });
        }

        function resizeEmbed(source) {
            const isLocked = document.getElementById('aspectLock').checked;
            const wInput = document.getElementById('eWidth');
            const hInput = document.getElementById('eHeight');
            if (isLocked) {
                if (source === 'w') hInput.value = Math.round(wInput.value * (9 / 16));
                else wInput.value = Math.round(hInput.value * (16 / 9));
            }
            updateEmbed();
        }

        function updateEmbed() {
            if (!currentVideoId) return;
            const w = document.getElementById('eWidth').value;
            const h = document.getElementById('eHeight').value;
            const s = document.getElementById('eStart').value;
            let embedUrl = `https://www.youtube.com/embed/${currentVideoId}?rel=0${s > 0 ? '&start='+s : ''}`;
            document.getElementById('outIframe').value = `<iframe width="${w}" height="${h}" src="${embedUrl}" frameborder="0" allowfullscreen></iframe>`;
        }

        function syncTime() {
            if (player && player.getCurrentTime) {
                document.getElementById('eStart').value = Math.floor(player.getCurrentTime());
                updateEmbed();
            }
        }

        function switchTab(type) {
            const isThumb = type === 'thumb';
            document.getElementById('tabThumb').classList.toggle('tab-active', isThumb);
            document.getElementById('tabEmbed').classList.toggle('tab-active', !isThumb);
            document.getElementById('contentThumb').classList.toggle('hidden', !isThumb);
            document.getElementById('contentEmbed').classList.toggle('hidden', isThumb);
        }

        function processVideo(vid = null) {
            currentVideoId = vid || extractVideoId(document.getElementById('videoUrl').value);
            if (!currentVideoId) return;

            saveHistory(currentVideoId);
            document.getElementById('resultArea').classList.remove('hidden');

            const mainUrl = `https://img.youtube.com/vi/${currentVideoId}/maxresdefault.jpg`;
            const thumbs = [mainUrl, `https://img.youtube.com/vi/${currentVideoId}/1.jpg`, `https://img.youtube.com/vi/${currentVideoId}/2.jpg`, `https://img.youtube.com/vi/${currentVideoId}/3.jpg` ];

            document.getElementById('sliderTrack').innerHTML = thumbs.map(url => `<img src="${url}" class="slide-item" onerror="this.src='https://img.youtube.com/vi/${currentVideoId}/hqdefault.jpg'">`).join('');

            if (player && player.loadVideoById) { player.loadVideoById(currentVideoId); }
            else { player = new YT.Player('player', { videoId: currentVideoId, playerVars: { 'rel': 0 }, events: { 'onReady': updateEmbed } }); }

            updateOutputs(mainUrl);
            updateEmbed();
        }

        function updateOutputs(url) {
            document.getElementById('thumbOutputs').innerHTML = `
                ${createCopyRow('Markdown', `[![](${url})](https://www.youtube.com/watch?v=${currentVideoId})`, 'outMd')}
                ${createCopyRow('HTML Tag', `<a href="https://www.youtube.com/watch?v=${currentVideoId}"><img src="${url}"></a>`, 'outHtml')}
                ${createCopyRow('Image URL', url, 'outUrl')}
            `;
        }

        function createCopyRow(label, value, id) {
            return `<div class="nothing-card p-4 flex items-center justify-between">
                <div class="flex-1 mr-4 text-[10px] font-mono"><span class="text-gray-400 block mb-1 uppercase font-bold">${label}</span><input type="text" id="${id}" value='${value}' readonly class="w-full bg-transparent outline-none"></div>
                <button onclick="copy('${id}')" class="btn-gray-copy">Copy</button>
            </div>`;
        }

        function saveHistory(id) {
            let history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            history = [id, ...history.filter(x => x !== id)].slice(0, 10);
            localStorage.setItem('yt_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('yt_history') || '[]');
            const list = document.getElementById('historyList');
            const section = document.getElementById('historySection');
            if (history.length === 0) { section.classList.add('hidden'); return; }
            section.classList.remove('hidden');
            list.innerHTML = history.map(id => `
                <div class="history-item nothing-card p-1.5" onclick="loadFromHistory('${id}')">
                    <img src="https://img.youtube.com/vi/${id}/mqdefault.jpg">
                </div>`).join('');
        }

        function loadFromHistory(id) {
            document.getElementById('videoUrl').value = `https://www.youtube.com/watch?v=${id}`;
            processVideo(id);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function copy(id) {
            const el = document.getElementById(id);
            await navigator.clipboard.writeText(el.value);
            const btn = event.currentTarget;
            const oldText = btn.innerText;
            btn.innerText = "DONE";
            btn.style.backgroundColor = "#000"; btn.style.color = "#fff";
            setTimeout(() => { btn.innerText = oldText; btn.style.backgroundColor = ""; btn.style.color = ""; }, 1000);
        }

        function clearInput() { document.getElementById('videoUrl').value = ''; document.getElementById('resultArea').classList.add('hidden'); }
    </script>
</body>
</html>
